<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RETRO ARCADE 1984</title>
  <!-- Ретро пиксельный шрифт -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-green: #33ff33;
      --neon-pink: #ff007f;
      --neon-cyan: #00e5ff;
      --neon-yellow: #ffe600;
      --bg-dark: #0a0a0f;
      --screen-bezel: #1a1921;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(#151525 15%, transparent 16%), radial-gradient(#181829 15%, transparent 16%);
      background-size: 30px 30px;
      color: var(--neon-green);
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px;
    }

    /* Заголовок в стиле неоновой вывески */
    header {
      text-align: center;
      margin: 10px 0 15px 0;
    }
    h1 {
      font-size: clamp(14px, 4vw, 24px);
      color: var(--neon-pink);
      text-shadow: 0 0 5px var(--neon-pink), 0 0 12px var(--neon-pink);
      letter-spacing: 2px;
      animation: flicker 3s infinite alternate;
    }
    .subtitle {
      font-size: clamp(8px, 2vw, 11px);
      color: var(--neon-cyan);
      margin-top: 6px;
      text-shadow: 0 0 5px var(--neon-cyan);
    }

    /* Корпус аркадного экрана */
    .arcade-cabinet {
      background: var(--screen-bezel);
      border: 4px solid #333;
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.2), inset 0 0 20px #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 100%;
    }

    /* Контейнер кинескопа (CRT) */
    .screen-wrapper {
      position: relative;
      background: #020804;
      border: 3px solid #111;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.9);
    }

    /* Сканлайны и эффект пузатого кинескопа */
    .screen-wrapper::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
      background-size: 100% 4px, 6px 100%;
      z-index: 10;
      pointer-events: none;
    }
    .screen-wrapper::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.7);
      z-index: 11;
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 360px;
      height: 360px;
      max-width: 85vw;
      max-height: 85vw;
      image-rendering: pixelated;
    }

    /* Верхняя панель счета и статуса */
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--neon-yellow);
      margin-bottom: 8px;
      padding: 0 4px;
      text-shadow: 0 0 5px var(--neon-yellow);
    }

    /* Меню выбора игр */
    .game-select-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .retro-btn {
      background: #111;
      color: var(--neon-cyan);
      border: 2px solid var(--neon-cyan);
      font-family: inherit;
      font-size: 9px;
      padding: 7px 10px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
      text-shadow: 0 0 4px var(--neon-cyan);
    }
    .retro-btn:active, .retro-btn.active {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 12px var(--neon-cyan);
    }

    /* Виртуальный мобильный геймпад */
    .mobile-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 360px;
      margin-top: 15px;
      padding: 0 10px;
    }

    .dpad {
      display: grid;
      grid-template-columns: 44px 44px 44px;
      grid-template-rows: 44px 44px 44px;
      gap: 4px;
    }
    .dpad-btn {
      background: #252430;
      border: 2px solid #555;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      box-shadow: 0 4px #111;
      cursor: pointer;
    }
    .dpad-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px #111;
      background: #444;
    }
    .dpad-up    { grid-column: 2; grid-row: 1; }
    .dpad-left  { grid-column: 1; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down  { grid-column: 2; grid-row: 3; }

    .action-group {
      display: flex;
      gap: 15px;
    }
    .act-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #a8004f;
      border: 3px solid #ff2a8d;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px #520026;
      cursor: pointer;
    }
    .act-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px #520026;
      background: #ff2a8d;
    }

    .footer-help {
      font-size: 8px;
      color: #777;
      margin-top: 15px;
      text-align: center;
      line-height: 1.5;
    }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
      20%, 24%, 55% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <header>
    <h1>★ RETRO ARCADE ★</h1>
    <div class="subtitle">INSERT COIN TO PLAY</div>
  </header>

  <div class="arcade-cabinet">
    <div class="hud">
      <span id="game-name">SNAKE</span>
      <span>SCORE: <span id="score">0</span></span>
      <span>HI: <span id="hi-score">0</span></span>
    </div>

    <div class="screen-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <!-- Кнопки выбора игры -->
    <div class="game-select-bar">
      <button class="retro-btn active" onclick="switchGame('snake')">ЗМЕЙКА</button>
      <button class="retro-btn" onclick="switchGame('bricks')">АРКАНОИД</button>
      <button class="retro-btn" onclick="switchGame('pong')">ПОНГ</button>
      <button class="retro-btn" id="sound-btn" onclick="toggleSound()">ЗВУК: ВКЛ</button>
    </div>
  </div>

  <!-- Виртуальный контроллер для смартфонов -->
  <div class="mobile-controls">
    <div class="dpad">
      <button class="dpad-btn dpad-up" id="btn-up">▲</button>
      <button class="dpad-btn dpad-left" id="btn-left">◀</button>
      <button class="dpad-btn dpad-right" id="btn-right">▶</button>
      <button class="dpad-btn dpad-down" id="btn-down">▼</button>
    </div>
    <div class="action-group">
      <button class="act-btn" id="btn-action">A</button>
    </div>
  </div>

  <div class="footer-help">
    УПРАВЛЕНИЕ НА ПК: СТРЕЛКИ / WASD И ПРОБЕЛ
  </div>

  <script>
    // --- ЗВУКОВОЙ ДВИЖОК (Web Audio API) ---
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq, type, duration) {
      if (!soundEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').innerText = `ЗВУК: ${soundEnabled ? 'ВКЛ' : 'ВЫКЛ'}`;
      if (soundEnabled) playTone(440, 'square', 0.1);
    }

    // --- CANVAS & НАСТРОЙКИ ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const hiScoreEl = document.getElementById("hi-score");
    const gameNameEl = document.getElementById("game-name");

    let currentGame = 'snake';
    let score = 0;
    let hiScore = localStorage.getItem('retro_hi_' + currentGame) || 0;
    hiScoreEl.innerText = hiScore;

    function updateScore(val) {
      score = val;
      scoreEl.innerText = score;
      if (score > hiScore) {
        hiScore = score;
        hiScoreEl.innerText = hiScore;
        localStorage.setItem('retro_hi_' + currentGame, hiScore);
      }
    }

    // --- ОБЩИЙ ЦИКЛ ОБРАБОТКИ ВВОДА ---
    const keys = {};

    window.addEventListener("keydown", e => {
      initAudio();
      keys[e.code] = true;
      if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) {
        e.preventDefault();
      }
      handleActionPress(e.code);
    });

    window.addEventListener("keyup", e => {
      keys[e.code] = false;
    });

    // Привязка мобильных кнопок
    function bindTouch(id, code) {
      const el = document.getElementById(id);
      const start = (e) => {
        e.preventDefault();
        initAudio();
        keys[code] = true;
        handleActionPress(code);
      };
      const end = (e) => {
        e.preventDefault();
        keys[code] = false;
      };
      el.addEventListener("touchstart", start);
      el.addEventListener("touchend", end);
      el.addEventListener("mousedown", start);
      el.addEventListener("mouseup", end);
    }

    bindTouch("btn-up", "ArrowUp");
    bindTouch("btn-down", "ArrowDown");
    bindTouch("btn-left", "ArrowLeft");
    bindTouch("btn-right", "ArrowRight");
    bindTouch("btn-action", "Space");

    function handleActionPress(code) {
      if (code === "Space" || code === "KeyA") {
        if (currentGame === 'snake' && snakeGameOver) initSnake();
        if (currentGame === 'bricks' && bricksGameOver) initBricks();
        if (currentGame === 'pong' && pongGameOver) initPong();
      }
    }

    // ==========================================
    // 1. ИГРА: ЗМЕЙКА (SNAKE)
    // ==========================================
    let snake, snakeDir, nextDir, food, snakeTimer, snakeGameOver;
    const GRID_SIZE = 20;
    const TILE_COUNT = 20; // 400 / 20 = 20x20

    function initSnake() {
      snake = [
        {x: 10, y: 10},
        {x: 10, y: 11},
        {x: 10, y: 12}
      ];
      snakeDir = {x: 0, y: -1};
      nextDir = {x: 0, y: -1};
      spawnFood();
      snakeGameOver = false;
      updateScore(0);
      snakeTimer = 0;
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * TILE_COUNT),
        y: Math.floor(Math.random() * TILE_COUNT)
      };
    }

    function updateSnake() {
      if (snakeGameOver) return;

      if ((keys['ArrowUp'] || keys['KeyW']) && snakeDir.y === 0) nextDir = {x: 0, y: -1};
      if ((keys['ArrowDown'] || keys['KeyS']) && snakeDir.y === 0) nextDir = {x: 0, y: 1};
      if ((keys['ArrowLeft'] || keys['KeyA']) && snakeDir.x === 0) nextDir = {x: -1, y: 0};
      if ((keys['ArrowRight'] || keys['KeyD']) && snakeDir.x === 0) nextDir = {x: 1, y: 0};

      snakeTimer++;
      if (snakeTimer < 6) return; // скорость змейки
      snakeTimer = 0;

      snakeDir = nextDir;
      const head = {x: snake[0].x + snakeDir.x, y: snake[0].y + snakeDir.y};

      // Столкновение со стенами
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        snakeGameOver = true;
        playTone(150, 'sawtooth', 0.4);
        return;
      }

      // Столкновение с собой
      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
          snakeGameOver = true;
          playTone(150, 'sawtooth', 0.4);
          return;
        }
      }

      snake.unshift(head);

      // Съели еду
      if (head.x === food.x && head.y === food.y) {
        playTone(600, 'square', 0.1);
        updateScore(score + 10);
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function drawSnake() {
      // Очистка
      ctx.fillStyle = "#051105";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Рисуем еду
      ctx.fillStyle = "#ff0055";
      ctx.shadowColor = "#ff0055";
      ctx.shadowBlur = 8;
      ctx.fillRect(food.x * GRID_SIZE + 2, food.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);

      // Рисуем змейку
      ctx.fillStyle = "#33ff33";
      ctx.shadowColor = "#33ff33";
      ctx.shadowBlur = 6;
      snake.forEach((seg, idx) => {
        ctx.fillStyle = idx === 0 ? "#88ff88" : "#33ff33";
        ctx.fillRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      });
      ctx.shadowBlur = 0;

      if (snakeGameOver) {
        drawGameOverText();
      }
    }

    // ==========================================
    // 2. ИГРА: АРКАНОИД (BRICK BREAKER)
    // ==========================================
    let paddleX, ballX, ballY, ballSpeedX, ballSpeedY, bricks, bricksGameOver;
    const PADDLE_WIDTH = 70;
    const PADDLE_HEIGHT = 10;
    const BALL_RADIUS = 5;

    function initBricks() {
      paddleX = (canvas.width - PADDLE_WIDTH) / 2;
      ballX = canvas.width / 2;
      ballY = canvas.height - 40;
      ballSpeedX = 3 * (Math.random() > 0.5 ? 1 : -1);
      ballSpeedY = -3.5;
      bricksGameOver = false;
      updateScore(0);

      bricks = [];
      const rows = 5;
      const cols = 7;
      const brickWidth = 48;
      const brickHeight = 14;
      const colors = ["#ff0055", "#ff7700", "#ffe600", "#00e5ff", "#33ff33"];

      for (let r = 0; r < rows; r++) {
        bricks[r] = [];
        for (let c = 0; c < cols; c++) {
          bricks[r][c] = {
            x: c * (brickWidth + 6) + 16,
            y: r * (brickHeight + 6) + 35,
            status: 1,
            color: colors[r]
          };
        }
      }
    }

    function updateBricks() {
      if (bricksGameOver) return;

      if (keys['ArrowLeft'] || keys['KeyA']) paddleX -= 6;
      if (keys['ArrowRight'] || keys['KeyD']) paddleX += 6;

      if (paddleX < 0) paddleX = 0;
      if (paddleX + PADDLE_WIDTH > canvas.width) paddleX = canvas.width - PADDLE_WIDTH;

      ballX += ballSpeedX;
      ballY += ballSpeedY;

      // Отскок от стен
      if (ballX + BALL_RADIUS > canvas.width || ballX - BALL_RADIUS < 0) {
        ballSpeedX = -ballSpeedX;
        playTone(300, 'square', 0.05);
      }
      if (ballY - BALL_RADIUS < 0) {
        ballSpeedY = -ballSpeedY;
        playTone(300, 'square', 0.05);
      }

      // Отскок от ракетки
      if (ballY + BALL_RADIUS >= canvas.height - 20 - PADDLE_HEIGHT &&
          ballY - BALL_RADIUS <= canvas.height - 20 &&
          ballX >= paddleX && ballX <= paddleX + PADDLE_WIDTH) {
        ballSpeedY = -Math.abs(ballSpeedY);
        // Добавляем угол в зависимости от места удара по ракетке
        const hitPoint = (ballX - (paddleX + PADDLE_WIDTH / 2)) / (PADDLE_WIDTH / 2);
        ballSpeedX = hitPoint * 4.5;
        playTone(450, 'square', 0.07);
      }

      // Разрушение кирпичей
      for (let r = 0; r < bricks.length; r++) {
        for (let c = 0; c < bricks[r].length; c++) {
          let b = bricks[r][c];
          if (b.status === 1) {
            if (ballX > b.x && ballX < b.x + 48 && ballY > b.y && ballY < b.y + 14) {
              ballSpeedY = -ballSpeedY;
              b.status = 0;
              playTone(700, 'square', 0.08);
              updateScore(score + 20);
            }
          }
        }
      }

      // Падение вниз
      if (ballY - BALL_RADIUS > canvas.height) {
        bricksGameOver = true;
        playTone(140, 'sawtooth', 0.4);
      }
    }

    function drawBricks() {
      ctx.fillStyle = "#0c0514";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Кирпичи
      for (let r = 0; r < bricks.length; r++) {
        for (let c = 0; c < bricks[r].length; c++) {
          let b = bricks[r][c];
          if (b.status === 1) {
            ctx.fillStyle = b.color;
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 6;
            ctx.fillRect(b.x, b.y, 48, 14);
          }
        }
      }

      // Ракетка
      ctx.fillStyle = "#00e5ff";
      ctx.shadowColor = "#00e5ff";
      ctx.shadowBlur = 10;
      ctx.fillRect(paddleX, canvas.height - 20 - PADDLE_HEIGHT, PADDLE_WIDTH, PADDLE_HEIGHT);

      // Мяч
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#ffffff";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (bricksGameOver) {
        drawGameOverText();
      }
    }

    // ==========================================
    // 3. ИГРА: ПОНГ (PONG VS BOT)
    // ==========================================
    let p1Y, p2Y, pBallX, pBallY, pBallSpeedX, pBallSpeedY, pongGameOver, p1Score, p2Score;
    const PONG_PAD_H = 60;
    const PONG_PAD_W = 10;

    function initPong() {
      p1Y = canvas.height / 2 - PONG_PAD_H / 2;
      p2Y = canvas.height / 2 - PONG_PAD_H / 2;
      resetPongBall();
      p1Score = 0;
      p2Score = 0;
      pongGameOver = false;
      updateScore(0);
    }

    function resetPongBall() {
      pBallX = canvas.width / 2;
      pBallY = canvas.height / 2;
      pBallSpeedX = (Math.random() > 0.5 ? 3.5 : -3.5);
      pBallSpeedY = (Math.random() * 4 - 2);
    }

    function updatePong() {
      if (pongGameOver) return;

      // Управление игрока (слева)
      if (keys['ArrowUp'] || keys['KeyW']) p1Y -= 5;
      if (keys['ArrowDown'] || keys['KeyS']) p1Y += 5;

      // Ограничение игрока
      if (p1Y < 0) p1Y = 0;
      if (p1Y + PONG_PAD_H > canvas.height) p1Y = canvas.height - PONG_PAD_H;

      // ИИ (справа)
      const botCenter = p2Y + PONG_PAD_H / 2;
      if (botCenter < pBallY - 12) p2Y += 3.8;
      else if (botCenter > pBallY + 12) p2Y -= 3.8;

      if (p2Y < 0) p2Y = 0;
      if (p2Y + PONG_PAD_H > canvas.height) p2Y = canvas.height - PONG_PAD_H;

      pBallX += pBallSpeedX;
      pBallY += pBallSpeedY;

      // Отскок от верх/низ
      if (pBallY < 0 || pBallY > canvas.height) {
        pBallSpeedY = -pBallSpeedY;
        playTone(250, 'square', 0.05);
      }

      // Удар по ракетке игрока (слева)
      if (pBallX <= 25 && pBallX >= 15 && pBallY >= p1Y && pBallY <= p1Y + PONG_PAD_H) {
        pBallSpeedX = Math.abs(pBallSpeedX) * 1.05;
        pBallSpeedY = (pBallY - (p1Y + PONG_PAD_H / 2)) * 0.2;
        playTone(500, 'square', 0.07);
      }

      // Удар по ракетке бота (справа)
      if (pBallX >= canvas.width - 25 && pBallX <= canvas.width - 15 && pBallY >= p2Y && pBallY <= p2Y + PONG_PAD_H) {
        pBallSpeedX = -Math.abs(pBallSpeedX) * 1.05;
        pBallSpeedY = (pBallY - (p2Y + PONG_PAD_H / 2)) * 0.2;
        playTone(400, 'square', 0.07);
      }

      // Гол боту
      if (pBallX > canvas.width) {
        p1Score++;
        updateScore(p1Score);
        playTone(700, 'square', 0.15);
        if (p1Score >= 5) {
          pongGameOver = true;
        } else {
          resetPongBall();
        }
      }

      // Гол игроку
      if (pBallX < 0) {
        p2Score++;
        playTone(150, 'sawtooth', 0.2);
        if (p2Score >= 5) {
          pongGameOver = true;
        } else {
          resetPongBall();
        }
      }
    }

    function drawPong() {
      ctx.fillStyle = "#050714";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Разделительная пунктирная линия
      ctx.strokeStyle = "#33334d";
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Счет по центру
      ctx.font = "20px 'Press Start 2P'";
      ctx.fillStyle = "#223355";
      ctx.fillText(p1Score, canvas.width / 2 - 50, 40);
      ctx.fillText(p2Score, canvas.width / 2 + 30, 40);

      // Ракетка 1 (Игрок)
      ctx.fillStyle = "#00e5ff";
      ctx.shadowColor = "#00e5ff";
      ctx.shadowBlur = 8;
      ctx.fillRect(15, p1Y, PONG_PAD_W, PONG_PAD_H);

      // Ракетка 2 (Бот)
      ctx.fillStyle = "#ff007f";
      ctx.shadowColor = "#ff007f";
      ctx.fillRect(canvas.width - 25, p2Y, PONG_PAD_W, PONG_PAD_H);

      // Мяч
      ctx.fillStyle = "#ffe600";
      ctx.shadowColor = "#ffe600";
      ctx.beginPath();
      ctx.arc(pBallX, pBallY, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (pongGameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = p1Score >= 5 ? "#33ff33" : "#ff0055";
        ctx.font = "16px 'Press Start 2P'";
        ctx.textAlign = "center";
        ctx.fillText(p1Score >= 5 ? "YOU WIN!" : "BOT WINS!", canvas.width / 2, canvas.height / 2 - 15);
        ctx.fillStyle = "#ffe600";
        ctx.font = "10px 'Press Start 2P'";
        ctx.fillText("PRESS 'A' / SPACE", canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = "left";
      }
    }

    // Сообщение Game Over для Snake и Bricks
    function drawGameOverText() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff0055";
      ctx.font = "18px 'Press Start 2P'";
      ctx.textAlign = "center";
      ctx.shadowColor = "#ff0055";
      ctx.shadowBlur = 8;
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);
      ctx.fillStyle = "#ffe600";
      ctx.font = "10px 'Press Start 2P'";
      ctx.shadowBlur = 0;
      ctx.fillText("PRESS 'A' / SPACE", canvas.width / 2, canvas.height / 2 + 20);
      ctx.textAlign = "left";
    }

    // ==========================================
    // ПЕРЕКЛЮЧЕНИЕ ИГР И ГЛАВНЫЙ ЦИКЛ
    // ==========================================
    function switchGame(name) {
      currentGame = name;
      document.querySelectorAll(".retro-btn").forEach(b => {
        if(b.id !== 'sound-btn') b.classList.remove("active");
      });
      event.target.classList.add("active");

      gameNameEl.innerText = name.toUpperCase();
      hiScore = localStorage.getItem('retro_hi_' + currentGame) || 0;
      hiScoreEl.innerText = hiScore;

      playTone(520, 'triangle', 0.1);

      if (name === 'snake') initSnake();
      if (name === 'bricks') initBricks();
      if (name === 'pong') initPong();
    }

    function gameLoop() {
      if (currentGame === 'snake') {
        updateSnake();
        drawSnake();
      } else if (currentGame === 'bricks') {
        updateBricks();
        drawBricks();
      } else if (currentGame === 'pong') {
        updatePong();
        drawPong();
      }
      requestAnimationFrame(gameLoop);
    }

    // Первый запуск
    initSnake();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
